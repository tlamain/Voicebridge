name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (static export)
        run: npm run build

      - name: Validate export and basePath links
        run: |
          test -d out
          test -f out/index.html
          node -e "const fs=require('fs');const path=require('path');const root='out';const bad=[];const walk=(dir)=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory()) walk(full);else if(entry.name.endsWith('.html')){const content=fs.readFileSync(full,'utf8');const matches=[...content.matchAll(/(?:href|src)=\"(\/[^\"#?]*)/g)].map(m=>m[1]);for(const url of matches){if(url==='/'||url.startsWith('/Voicebridge/')||url==='/Voicebridge') continue;bad.push({file:full,url});}}}};walk(root);if(bad.length){console.error('Found links not scoped to /Voicebridge:');for(const item of bad.slice(0,20)) console.error(item.file+' -> '+item.url);process.exit(1);}console.log('Export link validation passed.');"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
